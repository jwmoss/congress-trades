[project]
name = "congress-trades"
version = "0.2.0"
description = "CLI tool to track congressional stock trades"
readme = "README.md"
authors = [
    { name = "Jonathan Moss", email = "2729151+jwmoss@users.noreply.github.com" },
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.3.1",
    "httpx>=0.28.1",
    "rich>=14.3.2",
]

[project.scripts]
congress-trades = "congress_trades.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.15.1",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH"]
